[package]
name = "susz"
version = "0.1.1"
edition = "2021"
description = "Susz 1: a binary form of Lean 4 kernel exports (lean4export 3.1)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jasisz/susz"
readme = "README.md"
keywords = ["lean", "lean4", "kernel", "export", "binary-format"]
categories = ["encoding", "parser-implementations", "mathematics", "command-line-utilities"]
exclude = [".github/"]
rust-version = "1.80"

[dependencies]
# Only with the `mmap` feature (off by default): the library itself has no
# dependencies.
memmap2 = { version = "0.9.10", optional = true }

[features]
# susz::open_mmap, and the `susz` binary maps the files it verifies or
# unpacks instead of reading them: `cargo install susz --features mmap`.
mmap = ["dep:memmap2"]

[profile.release]
lto = true
codegen-units = 1
# A panic aborts after the hook in src/bin/susz.rs has removed any partial
# output and exited with code 2.
panic = "abort"
debug = false

[[example]]
name = "gen-vectors"
path = "examples/gen_vectors.rs"

[dev-dependencies]
flate2 = "1.1.11"
