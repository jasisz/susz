[package]
name = "susz"
version = "0.2.0"
edition = "2021"
description = "Susz 1: a binary form of Lean 4 kernel exports (lean4export 3.1)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jasisz/susz"
readme = "README.md"
keywords = ["lean", "lean4", "kernel", "export", "binary-format"]
categories = ["encoding", "parser-implementations", "mathematics", "command-line-utilities"]
exclude = [".github/"]
rust-version = "1.85"

[dependencies]
# Nat literals converted between decimal and binary by divide and conquer
# instead of digit by digit, which is quadratic: some exports (CFSG's
# certificates) hold literals of millions of digits.
malachite-nz = "0.6"
# The digest (susz digest): SHA-256 with the CPU's SHA instructions where
# there are some (ARMv8, x86 SHA-NI), detected at run time. 0.10 hashes in
# software on aarch64: 364 ns a node against 19 ns on an M2 Pro.
sha2 = { version = "0.11.0", default-features = false }
# Only with the `mmap` feature (off by default).
memmap2 = { version = "0.9.10", optional = true }

[features]
# susz::open_mmap, and the `susz` binary maps the files it verifies or
# unpacks instead of reading them: `cargo install susz --features mmap`.
mmap = ["dep:memmap2"]

[profile.release]
lto = true
codegen-units = 1
# A panic aborts after the hook in src/bin/susz.rs has removed any partial
# output and exited with code 2.
panic = "abort"
debug = false

[[example]]
name = "gen-vectors"
path = "examples/gen_vectors.rs"

[dev-dependencies]
flate2 = "1.1.11"
