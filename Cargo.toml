[package]
name = "susz"
version = "0.1.0"
edition = "2021"
description = "Susz 1: a binary form of Lean 4 kernel exports (lean4export 3.1)"
license = "Apache-2.0"
publish = false
rust-version = "1.80"

[dependencies]

[profile.release]
lto = true
codegen-units = 1
# A panic aborts after the hook in src/bin/susz.rs has removed any partial
# output and exited with code 2.
panic = "abort"
debug = false

[[example]]
name = "gen-vectors"
path = "examples/gen_vectors.rs"
